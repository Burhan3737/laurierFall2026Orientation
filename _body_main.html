<body>
<script>const META = {{META}};</script>

<!-- A keyboard user re-traverses the masthead, the identity band, the view
     buttons and the day rail on every change of view. This is the way past. -->
<button class="skip" id="skip">Skip to the board</button>

<header class="mast">
  <div class="mastin">
    <div class="crest">
      <span class="crest-w">Wilfrid Laurier University</span>
    </div>
    <h1>Orientation</h1>
    <p class="standfirst">Every published orientation event, laid out on the clock.</p>
  </div>
</header>

<div class="idbar" id="idbar"></div>
<div class="navstrip" id="navstrip"></div>
<main id="board" tabindex="-1"></main>

<!-- Changing level, ticking a stream or typing in the search box swaps the whole
     board silently. This says what changed, for anyone not watching it happen. -->
<p class="live" id="live" role="status" aria-live="polite"></p>

<!-- The printed schedule. Built by the script on every redraw and hidden on
     screen; the print stylesheet hides everything else and shows only this, so
     Ctrl+P and the button produce the same clean personal schedule. -->
<div class="printout" id="printout"></div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true"
     aria-labelledby="sheettitle" hidden></div>
<div class="scrim" id="scrim" hidden></div>

<section class="tail">
  <div class="tailin">
    <h2>Sources</h2>
    <div class="srcgrid">
{{SRCGRID}}
    </div>
  </div>
</section>

<footer class="foot">
  <div class="tailin">
    Reconfirm before travelling to a venue
  </div>
</footer>
